name: Post Reel to Instagram

# Non-stop: one run posts a Reel every 30 minutes (:00/:30) for ~5h20m, then dispatches the next run
# itself (chain=true), so posting never stops. GitHub's cron is unreliable (it skipped every
# 30-minute slot for a day), so cron is only a backup restarter. Up to POSTS_PER_DAY a day.
on:
  push:
    branches: [main]
    paths: ["trigger/**"]   # the daily Claude scheduled task: also just (re)starts the chain
  schedule:
    - cron: "20 */4 * * *"  # backup: restarts the chain if it ever breaks
  workflow_dispatch:
    inputs:
      force:
        description: "Post one extra Reel now, even if today's quota is used"
        type: boolean
        default: false
      per_day:
        description: "Reels allowed per posting day"
        type: number
        default: 10
      dry_run:
        description: "Dry run (show what would be posted, don't post)"
        type: boolean
        default: false
      chain:
        description: "Started by the previous run (waits for the next slot first)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # to dispatch the next run of the chain

concurrency:
  group: instagram-post
  cancel-in-progress: false

env:
  # 46/day keeps under Instagram's 50-posts-per-24h API limit
  # insights: hourly posting with near-identical Reels stalled every post at ~110 reach. One every 2 h, 10 per
  # posting day (from 6 AM IST), so nothing goes out in the dead hours of the night.
  POSTS_PER_DAY: ${{ inputs.per_day || 10 }}
  SLOT: 7200
  # a manual run posts right away; chained/cron/push runs wait for the next slot (no double post)
  WAIT_FIRST: ${{ github.event_name != 'workflow_dispatch' || inputs.chain }}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publish a Reel every 30 minutes
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "clips-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          next_slot() { w=$(( SLOT - $(date +%s) % SLOT )); [ $w -lt 600 ] && w=$((w + SLOT)); echo $w; }
          deadline=$(( $(date +%s) + 320 * 60 ))
          if [ "$WAIT_FIRST" = "true" ]; then w=$(next_slot); echo "First post in $((w / 60)) min"; sleep $w; fi
          fails=0
          while :; do
            git pull -q --rebase origin main   # latest state: never re-post what another run posted
            rc=0; node scripts/post.mjs || rc=$?
            git add -A state queue
            git diff --cached --quiet || (git commit -qm "Posted $(date -u +%FT%H:%MZ)" && git pull -q --rebase origin main && git push -q)
            [ $rc -ne 0 ] && [ $rc -ne 3 ] && fails=$((fails + 1))  # 3 = quota used / queue empty: try next slot
            [ "$FORCE" = "true" ] || [ "$DRY_RUN" = "true" ] && exit $([ $fails -eq 0 ] && echo 0 || echo 1)
            w=$(next_slot)
            [ $(( $(date +%s) + w )) -gt $deadline ] && break
            echo "Next post in $((w / 60)) min"; sleep $w
          done
          gh workflow run post.yml --ref main -f chain=true -f per_day="$POSTS_PER_DAY" && echo "Next run of the chain dispatched"
          [ $fails -eq 0 ]
