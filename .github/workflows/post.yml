name: Post Reel to Instagram

# A cron run every 30 minutes posts one Reel (up to POSTS_PER_DAY a day).
# A manual run loops, posting every 30 minutes, until the quota or queue runs out.
on:
  # Main trigger: a daily Claude scheduled task (12:00 PM IST) pushes trigger/request.txt.
  push:
    branches: [main]
    paths: ["trigger/**"]
  schedule:
    # Non-stop: one Reel per run, every 30 minutes (GitHub may start these a few minutes late).
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Post even if today's quota is already used"
        type: boolean
        default: false
      per_day:
        description: "Reels allowed today (raise it to post a second batch the same day)"
        type: number
        default: 10
      dry_run:
        description: "Dry run (show what would be posted, don't post)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

env:
  # 46/day keeps under Instagram's 50-posts-per-24h API limit
  POSTS_PER_DAY: ${{ inputs.per_day || 46 }}
  # scheduled/push runs post one Reel and exit; a manual run loops every 30 min as before
  ONE_SHOT: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publish Reels every 30 minutes
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git config user.name "clips-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fails=0
          for i in $(seq 1 $((POSTS_PER_DAY + 2))); do
            git pull -q --rebase origin main   # latest state: never re-post what another run posted
            rc=0; node scripts/post.mjs || rc=$?
            git add -A state queue
            git diff --cached --quiet || (git commit -qm "Posted $(date -u +%FT%H:%MZ)" && git pull -q --rebase origin main && git push -q)
            [ $rc -eq 3 ] && break                       # today's quota done or queue empty
            [ $rc -ne 0 ] && fails=$((fails + 1))        # a failed post is retried next slot
            [ "$FORCE" = "true" ] && break               # force = one extra post, not a loop
            [ "$ONE_SHOT" = "true" ] && break            # the next cron run posts the next one
            # next :00/:30 slot, at least 10 minutes away
            wait=$(( 1800 - $(date +%s) % 1800 )); [ $wait -lt 600 ] && wait=$((wait + 1800))
            echo "Next post in $((wait / 60)) min"; sleep $wait
          done
          [ $fails -eq 0 ]
